[toolchain]
# Pin for reproducible builds. Bump in lockstep with the Cargo dependency.
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Must match `declare_id!` in programs/lofi_rewards/src/lib.rs.
# TODO(audit): regenerate with `anchor keys sync` after creating the program
# keypair; the placeholder below mirrors the id used in lib.rs.
lofi_rewards = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
lofi_rewards = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` runs this after spinning up a local validator and deploying.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000

[test.validator]
# Local validator config. Add `[[test.validator.clone]]` entries here if you
# later want to clone the live pump.fun program for integration tests.
url = "https://api.mainnet-beta.solana.com"
