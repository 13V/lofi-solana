# Anchor workspace manifest for the `lofi_rewards` program.
#
# This is a self-contained Anchor workspace living under
# /programs/lofi_rewards of the lofi-solana monorepo. Members are the on-chain
# program crate(s) under ./programs/*.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
